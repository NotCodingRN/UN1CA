name: Build target

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target codename'
        required: true
        default: 'r8q'
      mode:
        description: 'diagnose: keep going past failed patches and collect them, build: flashable zip'
        required: true
        type: choice
        options:
          - diagnose
          - build
        default: 'diagnose'
      keep_going:
        description: 'build: debug build that skips patches still failing on the source firmware (test only)'
        required: false
        type: boolean
        default: false

env:
  KEEP_GOING: ${{ inputs.mode == 'diagnose' || inputs.keep_going }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.mode }} ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          PACKAGES=(attr ccache clang ffmpeg libbrotli-dev libbz2-dev
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev
            libzstd-dev lld protobuf-compiler webp)
          # Not published yet for freshly rolled out runner kernels, EROFS images are unpacked with fuse.erofs anyway
          if apt-cache show "linux-modules-extra-$(uname -r)" &> /dev/null; then
            PACKAGES+=("linux-modules-extra-$(uname -r)")
          else
            echo "::warning::linux-modules-extra-$(uname -r) is not available, skipping"
          fi
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq "${PACKAGES[@]}"
          sudo modprobe erofs f2fs || echo "::warning::Could not load erofs/f2fs kernel modules"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          if [[ "$KEEP_GOING" == "true" ]]; then
            source ./buildenv.sh --debug ${{ inputs.target }}
          else
            source ./buildenv.sh ${{ inputs.target }}
          fi
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          ./scripts/extract_fw.sh
          df -h /

      - name: Keep going past failed patches
        if: env.KEEP_GOING == 'true'
        run: sed -i 's/^set -e$/set +e/' scripts/internal/apply_modules.sh

      - name: Build ROM
        run: |
          set -o pipefail
          if [[ "${{ inputs.mode }}" == "diagnose" ]]; then
            ./scripts/make_rom.sh --no-target-files 2>&1 | tee build.log
          else
            ./scripts/make_rom.sh --build-rom-zip 2>&1 | tee build.log
          fi

      - name: Collect diagnostics
        if: always()
        run: ./.github/scripts/collect_diagnostics.sh build.log diagnostics

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ inputs.target }}-${{ inputs.mode }}
          path: diagnostics
          if-no-files-found: ignore

      - name: Upload ROM
        if: success() && inputs.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: rom-${{ inputs.target }}
          path: out/UN1CA*.zip
          compression-level: 0
